name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CDN dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor

          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js \
            --output vendor/alpine.min.js
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/mediabunny@1.55.1/dist/bundles/mediabunny.min.mjs \
            --output vendor/mediabunny.min.mjs

          test -s vendor/alpine.min.js
          test -s vendor/mediabunny.min.mjs

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='LICENSE' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
