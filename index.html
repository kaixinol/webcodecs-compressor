<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    
    <!-- SEO Meta Tags -->
    <title>Video Compressor - MediaBunny | Local WebCodecs Video Processing</title>
    <meta name="description" content="Online video compression tool powered by WebCodecs API. Processes entirely in your local browser without uploading to servers, protecting your privacy. Supports H.264, H.265, VP9, AV1 and more." />
    <meta name="keywords" content="video compressor, WebCodecs, local processing, online video tool, privacy protection, H.264, H.265, VP9, AV1, video encoding, browser video processing, MediaBunny" />
    <meta name="author" content="MediaBunny" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Video Compressor - MediaBunny | Local WebCodecs Video Processing" />
    <meta property="og:description" content="Online video compression tool powered by WebCodecs API. Processes entirely in your local browser without uploading to servers." />
    
    <!-- Language Alternates -->
    <link rel="alternate" hreflang="en" href="./index.html" />
    <link rel="alternate" hreflang="zh-CN" href="./index-zh.html" />
    <link rel="alternate" hreflang="x-default" href="./index.html" />
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#81c784" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Video Compressor" />
    
    <script type="importmap">
      {
        "imports": {
          "mediabunny": "./vendor/mediabunny.min.mjs"
        }
      }
    </script>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Language Switcher -->
    <div class="lang-switcher">
      <a href="./index-zh.html" class="lang-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        中文
      </a>
    </div>

    <div class="container" x-data="videoCompressor" x-init="init()">
      <h1>Video Compressor</h1>
      <p class="subtitle">
        Local video processing &mdash; MediaBunny &amp; WebCodecs
      </p>

      <!-- File upload -->
      <div class="card">
        <div
          class="drop-zone"
          :class="{ 'drag-over': dragging }"
          @dragover.prevent="dragging = true"
          @dragleave="dragging = false"
          @drop.prevent="handleDrop($event)"
          @click="$refs.fileInput.click()"
        >
          <input
            type="file"
            x-ref="fileInput"
            accept="video/*,.mkv,.webm,.mp4"
            @change="handleFileSelect($event)"
            @click="$event.target.value = null"
            style="display: none"
          />
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#81c784"
            stroke-width="1.5"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <p>Click or drag video file here</p>
        </div>

      <template x-if="file">
        <div class="file-info">
            <span class="icon">&#x1f3ac;</span>
            <span class="name" x-text="file.name"></span>
            <span class="size" x-text="formatSize(file.size)"></span>
            <button class="remove" @click.stop="clearFile()">&times;</button>
          </div>
        </template>
      </div>

      <!-- Metadata -->
      <template x-if="metadata">
        <div class="card">
          <!-- Basic info: open by default -->
          <details class="meta-section" open>
            <summary>Source file info</summary>
            <table class="meta-table">
              <tr>
                <th colspan="2" class="meta-section-header">General</th>
              </tr>
              <tr>
                <th>File</th>
                <td x-text="metadata.fileName"></td>
              </tr>
              <tr>
                <th>Size</th>
                <td x-text="metadata.fileSizeStr"></td>
              </tr>
              <tr>
                <th>Container</th>
                <td x-text="metadata.container"></td>
              </tr>
              <tr>
                <th>Duration</th>
                <td x-text="metadata.durationStr"></td>
              </tr>
              <tr>
                <th>Avg. bitrate</th>
                <td x-text="metadata.totalBitrateStr"></td>
              </tr>
            </table>
          </details>

          <!-- Video: collapsed by default -->
          <template x-if="metadata.video">
            <details class="meta-section">
              <summary>Video</summary>
              <table class="meta-table">
                <tr>
                  <th>Codec</th>
                  <td x-text="metadata.video.codec"></td>
                </tr>
                <tr>
                  <th>Coded size</th>
                  <td
                    x-text="metadata.video.codedW + '\u00d7' + metadata.video.codedH"
                  ></td>
                </tr>
                <tr>
                  <th>Display size</th>
                  <td
                    x-text="metadata.video.displayW + '\u00d7' + metadata.video.displayH"
                  ></td>
                </tr>
                <tr>
                  <th>Frame rate</th>
                  <td x-text="metadata.video.fps + ' fps'"></td>
                </tr>
                <tr>
                  <th>Rotation</th>
                  <td x-text="(metadata.video.rotation || 0) + '\u00b0'"></td>
                </tr>
                <tr>
                  <th>Bitrate</th>
                  <td
                    x-text="metadata.video.bitrate ? (metadata.video.bitrate / 1000).toFixed(0) + ' kbps' : 'unknown'"
                  ></td>
                </tr>
                <tr>
                  <th>Pixel aspect</th>
                  <td x-text="metadata.video.aspectRatio"></td>
                </tr>
                <tr>
                  <th>Color space</th>
                  <td x-text="metadata.video.colorSpace"></td>
                </tr>
                <tr>
                  <th>Key-frame interval</th>
                  <td
                    x-text="metadata.video.keyFrameInterval ? metadata.video.keyFrameInterval.toFixed(1) + 's' : 'unknown'"
                  ></td>
                </tr>
              </table>
            </details>
          </template>

          <!-- Audio: collapsed by default -->
          <template x-if="metadata.audio">
            <details class="meta-section">
              <summary>Audio</summary>
              <table class="meta-table">
                <tr>
                  <th>Codec</th>
                  <td x-text="metadata.audio.codec"></td>
                </tr>
                <tr>
                  <th>Channels</th>
                  <td x-text="metadata.audio.channelLabel"></td>
                </tr>
                <tr>
                  <th>Sample rate</th>
                  <td x-text="metadata.audio.sampleRate + ' Hz'"></td>
                </tr>
                <tr>
                  <th>Bitrate</th>
                  <td
                    x-text="metadata.audio.bitrate ? (metadata.audio.bitrate / 1000).toFixed(0) + ' kbps' : 'unknown'"
                  ></td>
                </tr>
              </table>
            </details>
          </template>

          <template x-if="!metadata.audio">
            <details class="meta-section">
              <summary>Audio</summary>
              <table class="meta-table">
                <tr>
                  <td colspan="2" style="color: #888; padding-top: 0.25rem">
                    No audio track
                  </td>
                </tr>
              </table>
            </details>
          </template>
        </div>
      </template>
      <template x-if="sourceDecodeSupported === false">
        <p class="status error">This browser cannot decode the selected video.</p>
      </template>

      <!-- Settings -->
      <div class="card">
        <!-- Output tracks -->
        <div class="form-group">
          <label for="output_mode">Output tracks</label>
          <select id="output_mode" x-model="settings.outputMode" @change="syncAudioCodec()">
            <option value="muxed">Video + audio</option>
            <option value="video-only">Video only</option>
            <option value="audio-only">Audio only</option>
          </select>
        </div>

        <!-- Codec support and selector -->
        <div class="form-group" x-show="settings.outputMode !== 'audio-only'">
          <template x-if="!file">
            <div class="codec-support-list">
              <div class="codec-support-row codec-support-header">
                <span>Video codec</span>
                <span>Encode</span>
                <span>Playback</span>
              </div>
              <template x-for="c in codecs" :key="c.id">
                <div class="codec-support-row">
                  <span x-text="c.label"></span>
                  <span
                    class="codec-support-status"
                    :class="c.encodeSupported ? 'supported' : 'unsupported'"
                    x-text="c.encodeSupported ? 'Supported' : 'Unavailable'"
                  ></span>
                  <span
                    class="codec-support-status"
                    :class="c.outputDecodeSupported === false ? 'unsupported' : (c.outputDecodeSupported === true ? 'supported' : 'unknown')"
                    x-text="c.outputDecodeSupported === false ? 'Unavailable' : (c.outputDecodeSupported === true ? 'Supported' : 'Unknown')"
                  ></span>
                </div>
              </template>
            </div>
          </template>

          <template x-if="file">
            <div>
              <label>Video codec</label>
              <select
                x-model="settings.codec"
                :title="selectedUnsupported ? unsupportedTooltip : ''"
              >
                <template x-for="c in codecs" :key="c.id">
                  <option
                    :value="c.id"
                    :disabled="!c.encodeSupported"
                    x-text="c.label + (c.encodeSupported ? '' : '  \u2717')"
                  ></option>
                </template>
              </select>
              <template x-if="selectedCodecObj && selectedCodecObj.outputDecodeSupported === false">
                <p class="codec-output-warning">This browser may not play the selected output.</p>
              </template>
            </div>
          </template>
        </div>

        <!-- Optional GPU diagnostic -->
        <div class="form-group gpu-diagnostic">
          <button
            class="btn btn-secondary"
            type="button"
            @click="runGpuDiagnostic()"
            :disabled="gpuDiagnosticStatus === 'running'"
            x-text="gpuDiagnosticStatus === 'running' ? 'Running compatibility test…' : 'Run GPU compatibility test'"
          ></button>
          <template x-if="gpuDiagnosticStatus === 'passed'">
            <p class="diagnostic-status success">GPU/WebCodecs test passed.</p>
          </template>
          <template x-if="gpuDiagnosticStatus === 'failed'">
            <p class="diagnostic-status error" x-text="'Compatibility test failed: ' + gpuDiagnosticMessage"></p>
          </template>
        </div>

        <!-- Quality mode -->
        <div class="form-group">
          <label>Quality mode</label>
          <div class="pill-row">
            <span
              class="pill"
              :class="{ active: settings.qualityPreset === 'auto' }"
              @click="settings.qualityPreset = 'auto'"
            >
              Compress (auto)
            </span>
            <span
              class="pill"
              :class="{ active: settings.qualityPreset === 'original' }"
              @click="settings.qualityPreset = 'original'"
            >
              Original quality
            </span>
          </div>
        </div>

        <!-- Resolution -->
        <div class="form-group">
          <label>Resolution</label>
          <div class="pill-row">
            <template x-for="p in presets" :key="p.id">
              <span
                class="pill"
                :class="{
                'active': settings.resolution === p.id,
                'disabled': resolutionDisabled(p)
              }"
                @click="!resolutionDisabled(p) && setResolution(p.id)"
                :title="resolutionTooltip(p)"
                x-text="p.label"
              ></span>
            </template>
          </div>

          <div
            class="form-row"
            style="margin-top: 0.5rem"
            x-show="settings.resolution === 'custom'"
          >
            <input
              type="number"
              x-model.number="settings.customWidth"
              placeholder="Width"
              min="64"
              max="3840"
            />
            <input
              type="number"
              x-model.number="settings.customHeight"
              placeholder="Height"
              min="64"
              max="2160"
            />
          </div>
        </div>

        <!-- Bitrate (auto only) -->
        <div class="form-group" x-show="settings.qualityPreset === 'auto'">
          <label
            >Video bitrate
            <span style="color: #666">(kbps, 0 = auto)</span></label
          >
          <input
            type="number"
            x-model.number="settings.bitrate"
            min="0"
            max="20000"
            step="100"
            placeholder="0"
          />
        </div>

        <!-- Speed -->
        <div class="form-group">
          <label>Playback speed</label>
          <input
            type="number"
            x-model.number="settings.speed"
            min="0.1"
            max="10"
            step="0.05"
            placeholder="1.0"
          />
        </div>

        <!-- Audio encoding -->
        <div class="form-group" x-show="!metadata || metadata.audio">
          <label for="audio_codec">Audio codec</label>
          <select id="audio_codec" x-model="settings.audioCodec" @change="syncAudioCodec()">
            <template x-for="c in audioCodecChoices" :key="c.id">
              <option :value="c.id" x-text="c.label"></option>
            </template>
          </select>
          <label for="audio_bitrate" style="margin-top: 0.75rem">Audio bitrate (kbps)</label>
          <input
            id="audio_bitrate"
            type="number"
            x-model.number="settings.audioBitrate"
            min="32"
            max="512"
            step="8"
          />
        </div>

        <!-- Auto-download -->
        <div class="form-group">
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="auto_dl"
              x-model="settings.autoDownload"
            />
            <label for="auto_dl">Auto-download after processing</label>
          </div>
        </div>
      </div>

      <!-- Resolution warning toast -->
      <template x-if="warning">
        <div class="toast-warning">
          <span class="warn-icon">⚠️</span>
          <span x-text="warning"></span>
        </div>
      </template>

      <!-- Action -->
      <button
        class="btn btn-primary"
        :disabled="!canStart"
        @click="startProcessing"
        x-text="processing ? 'Processing …' : 'Start processing'"
      ></button>

      <template x-if="processing">
        <button class="btn btn-cancel" @click="cancelProcessing">Cancel</button>
      </template>

      <!-- Progress -->
      <template x-if="processing || progress > 0">
        <div style="margin-top: 1rem">
          <progress :value="progress" max="1"></progress>
          <p class="status processing" x-text="statusMessage"></p>
        </div>
      </template>

      <!-- Error -->
      <template x-if="error">
        <p class="status error" x-text="error"></p>
      </template>

      <!-- Success -->
      <template x-if="downloadUrl">
        <div class="status success">
          <p>Processing complete!</p>
          <a
            :href="downloadUrl"
            :download="outputFileName"
            style="
              display: inline-block;
              margin-top: 0.5rem;
              color: inherit;
              text-decoration: underline;
            "
          >
            Download <span x-text="outputFileName"></span>
          </a>
        </div>
      </template>
    </div>

    <script type="module">
      import registerApp from "./main.js";

      if (window.Alpine) {
        window.Alpine.data("videoCompressor", registerApp);
      } else {
        document.addEventListener("alpine:init", () => {
          window.Alpine.data("videoCompressor", registerApp);
        });
      }
    </script>
    <script
      defer
      src="./vendor/alpine.min.js"
    ></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[PWA] ServiceWorker registration successful:', registration.scope);
            })
            .catch((error) => {
              console.log('[PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
