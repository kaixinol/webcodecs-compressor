<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    
    <!-- SEO Meta Tags -->
    <title>视频压缩工具 - MediaBunny | 本地 WebCodecs 视频处理</title>
    <meta name="description" content="基于 WebCodecs API 的在线视频压缩工具，完全在本地浏览器中处理，无需上传到服务器，保护您的隐私。支持 H.264、H.265、VP9、AV1 等多种编码格式。" />
    <meta name="keywords" content="视频压缩，WebCodecs，本地处理，在线视频工具，隐私保护，H.264,H.265,VP9,AV1，视频编码，浏览器视频处理，MediaBunny" />
    <meta name="author" content="MediaBunny" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="视频压缩工具 - MediaBunny | 本地 WebCodecs 视频处理" />
    <meta property="og:description" content="基于 WebCodecs API 的在线视频压缩工具，完全在本地浏览器中处理，无需上传到服务器，保护您的隐私。" />
    
    <!-- Language Alternates -->
    <link rel="alternate" hreflang="en" href="./index.html" />
    <link rel="alternate" hreflang="zh-CN" href="./index-zh.html" />
    <link rel="alternate" hreflang="x-default" href="./index.html" />
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#81c784" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="视频压缩工具" />
    
    <script type="importmap">
      {
        "imports": {
          "mediabunny": "./vendor/mediabunny.min.mjs"
        }
      }
    </script>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Language Switcher -->
    <div class="lang-switcher">
      <a href="./index.html" class="lang-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        English
      </a>
    </div>

    <div class="container" x-data="videoCompressor" x-init="init()">
      <h1>视频压缩工具</h1>
      <p class="subtitle">
        本地视频处理 &mdash; MediaBunny &amp; WebCodecs
      </p>

      <!-- File upload -->
      <div class="card">
        <div
          class="drop-zone"
          :class="{ 'drag-over': dragging }"
          @dragover.prevent="dragging = true"
          @dragleave="dragging = false"
          @drop.prevent="handleDrop($event)"
          @click="$refs.fileInput.click()"
        >
          <input
            type="file"
            x-ref="fileInput"
            accept="video/*,.mkv,.webm,.mp4"
            @change="handleFileSelect($event)"
            @click="$event.target.value = null"
            style="display: none"
          />
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#81c784"
            stroke-width="1.5"
          >
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <p>点击或拖拽视频文件到此处</p>
        </div>

      <template x-if="file">
        <div class="file-info">
            <span class="icon">&#x1f3ac;</span>
            <span class="name" x-text="file.name"></span>
            <span class="size" x-text="formatSize(file.size)"></span>
            <button class="remove" @click.stop="clearFile()">&times;</button>
          </div>
        </template>
      </div>

      <!-- Metadata -->
      <template x-if="metadata">
        <div class="card">
          <!-- Basic info: open by default -->
          <details class="meta-section" open>
            <summary>源文件信息</summary>
            <table class="meta-table">
              <tr>
                <th colspan="2" class="meta-section-header">常规</th>
              </tr>
              <tr>
                <th>文件</th>
                <td x-text="metadata.fileName"></td>
              </tr>
              <tr>
                <th>大小</th>
                <td x-text="metadata.fileSizeStr"></td>
              </tr>
              <tr>
                <th>容器格式</th>
                <td x-text="metadata.container"></td>
              </tr>
              <tr>
                <th>时长</th>
                <td x-text="metadata.durationStr"></td>
              </tr>
              <tr>
                <th>平均码率</th>
                <td x-text="metadata.totalBitrateStr"></td>
              </tr>
            </table>
          </details>

          <!-- Video: collapsed by default -->
          <template x-if="metadata.video">
            <details class="meta-section">
              <summary>视频</summary>
              <table class="meta-table">
                <tr>
                  <th>编码格式</th>
                  <td x-text="metadata.video.codec"></td>
                </tr>
                <tr>
                  <th>编码尺寸</th>
                  <td
                    x-text="metadata.video.codedW + '\u00d7' + metadata.video.codedH"
                  ></td>
                </tr>
                <tr>
                  <th>显示尺寸</th>
                  <td
                    x-text="metadata.video.displayW + '\u00d7' + metadata.video.displayH"
                  ></td>
                </tr>
                <tr>
                  <th>帧率</th>
                  <td x-text="metadata.video.fps + ' fps'"></td>
                </tr>
                <tr>
                  <th>旋转角度</th>
                  <td x-text="(metadata.video.rotation || 0) + '\u00b0'"></td>
                </tr>
                <tr>
                  <th>码率</th>
                  <td
                    x-text="metadata.video.bitrate ? (metadata.video.bitrate / 1000).toFixed(0) + ' kbps' : 'unknown'"
                  ></td>
                </tr>
                <tr>
                  <th>像素宽高比</th>
                  <td x-text="metadata.video.aspectRatio"></td>
                </tr>
                <tr>
                  <th>色彩空间</th>
                  <td x-text="metadata.video.colorSpace"></td>
                </tr>
                <tr>
                  <th>关键帧间隔</th>
                  <td
                    x-text="metadata.video.keyFrameInterval ? metadata.video.keyFrameInterval.toFixed(1) + 's' : 'unknown'"
                  ></td>
                </tr>
              </table>
            </details>
          </template>

          <!-- Audio: collapsed by default -->
          <template x-if="metadata.audio">
            <details class="meta-section">
              <summary>音频</summary>
              <table class="meta-table">
                <tr>
                  <th>编码格式</th>
                  <td x-text="metadata.audio.codec"></td>
                </tr>
                <tr>
                  <th>声道数</th>
                  <td x-text="metadata.audio.channelLabel"></td>
                </tr>
                <tr>
                  <th>采样率</th>
                  <td x-text="metadata.audio.sampleRate + ' Hz'"></td>
                </tr>
                <tr>
                  <th>码率</th>
                  <td
                    x-text="metadata.audio.bitrate ? (metadata.audio.bitrate / 1000).toFixed(0) + ' kbps' : 'unknown'"
                  ></td>
                </tr>
              </table>
            </details>
          </template>

          <template x-if="!metadata.audio">
            <details class="meta-section">
              <summary>音频</summary>
              <table class="meta-table">
                <tr>
                  <td colspan="2" style="color: #888; padding-top: 0.25rem">
                    无音频轨道
                  </td>
                </tr>
              </table>
            </details>
          </template>
        </div>
      </template>
      <template x-if="sourceDecodeSupported === false">
        <p class="status error">当前浏览器无法解码所选视频。</p>
      </template>

      <!-- Settings -->
      <div class="card">
        <!-- 输出轨道 -->
        <div class="form-group">
          <label for="output_mode">输出轨道</label>
          <select id="output_mode" :value="settings.outputMode" @change="setOutputMode($event.target.value)">
            <option value="muxed">视频 + 音频</option>
            <option value="video-only">仅视频</option>
            <option value="audio-only">仅音频</option>
          </select>
        </div>

        <!-- 编码支持和选择 -->
        <div class="form-group" x-show="settings.outputMode !== 'audio-only'">
          <template x-if="!file">
            <div class="codec-support-list">
              <div class="codec-support-row codec-support-header">
                <span>视频编码</span>
                <span>编码</span>
                <span>解码</span>
              </div>
              <template x-for="c in codecs" :key="c.id">
                <div class="codec-support-row">
                  <span x-text="c.label"></span>
                  <span
                    class="codec-support-status"
                    :class="c.encodeSupported ? 'supported' : 'unsupported'"
                    x-text="c.encodeSupported ? '支持' : '不支持'"
                  ></span>
                  <span
                    class="codec-support-status"
                    :class="c.outputDecodeSupported === false ? 'unsupported' : (c.outputDecodeSupported === true ? 'supported' : 'unknown')"
                    x-text="c.outputDecodeSupported === false ? '不支持' : (c.outputDecodeSupported === true ? '支持' : '未知')"
                  ></span>
                </div>
              </template>
            </div>
          </template>

          <template x-if="file">
            <div>
              <label>视频编码</label>
              <select
                x-model="settings.codec"
                :title="selectedUnsupported ? unsupportedTooltip : ''"
              >
                <template x-for="c in codecs" :key="c.id">
                  <option
                    :value="c.id"
                    :disabled="!c.encodeSupported"
                    x-text="c.label + (c.encodeSupported ? '' : '  \u2717')"
                  ></option>
                </template>
              </select>
              <template x-if="selectedCodecObj && selectedCodecObj.outputDecodeSupported === false">
                <p class="codec-output-warning">当前浏览器可能无法播放所选输出。</p>
              </template>
            </div>
          </template>
        </div>

        <!-- 质量模式 -->
        <div class="form-group">
          <label>质量模式</label>
          <div class="pill-row">
            <span
              class="pill"
              :class="{ active: settings.qualityPreset === 'auto' }"
              @click="settings.qualityPreset = 'auto'"
             
            >
              压缩（自动）
            </span>
            <span
              class="pill"
              :class="{ active: settings.qualityPreset === 'original' }"
              @click="settings.qualityPreset = 'original'"
             
            >
              原始质量
            </span>
          </div>
        </div>

        <!-- Resolution -->
        <div class="form-group">
          <label>分辨率</label>
          <div class="pill-row">
            <template x-for="p in presets" :key="p.id">
              <span
                class="pill"
                :class="{
                'active': settings.resolution === p.id,
                'disabled': resolutionDisabled(p)
              }"
                @click="!resolutionDisabled(p) && setResolution(p.id)"
                :title="resolutionTooltip(p)"
                x-text="p.label"
              ></span>
            </template>
          </div>

          <div
            class="form-row"
            style="margin-top: 0.5rem"
            x-show="settings.resolution === 'custom'"
          >
            <input
              type="number"
              x-model.number="settings.customWidth"
              placeholder="宽度"
              min="64"
              max="3840"
            />
            <input
              type="number"
              x-model.number="settings.customHeight"
              placeholder="高度"
              min="64"
              max="2160"
            />
          </div>
        </div>

        <!-- Bitrate (auto only) -->
        <div class="form-group" x-show="settings.qualityPreset === 'auto'">
          <label
            >视频码率
            <span style="color: #666">(kbps, 0 = 自动)</span></label
          >
          <input
            type="number"
            x-model.number="settings.bitrate"
            min="0"
            max="20000"
            step="100"
            placeholder="0"
          />
        </div>

        <!-- Speed -->
        <div class="form-group">
          <label>播放速度</label>
          <input
            type="number"
            x-model.number="settings.speed"
            min="0.1"
            max="10"
            step="0.05"
            placeholder="1.0"
          />
        </div>

        <!-- 音频编码 -->
        <div class="form-group" x-show="!metadata || metadata.audio">
          <label for="audio_codec">音频编码</label>
          <select id="audio_codec" x-model="settings.audioCodec" @change="syncAudioCodec()">
            <template x-for="c in audioCodecChoices" :key="c.id">
              <option :value="c.id" x-text="c.label"></option>
            </template>
          </select>
          <label for="audio_bitrate" style="margin-top: 0.75rem">音频码率（kbps）</label>
          <input
            id="audio_bitrate"
            type="number"
            x-model.number="settings.audioBitrate"
            min="32"
            max="512"
            step="8"
          />
        </div>

        <!-- Auto-download -->
        <div class="form-group">
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="auto_dl"
              x-model="settings.autoDownload"
            />
            <label for="auto_dl">处理完成后自动下载</label>
          </div>
        </div>
      </div>

      <!-- Resolution warning toast -->
      <template x-if="warning">
        <div class="toast-warning">
          <span class="warn-icon">⚠️</span>
          <span x-text="warning"></span>
        </div>
      </template>

      <!-- Action -->
      <button
        class="btn btn-primary"
        :disabled="!canStart"
        @click="startProcessing"
        x-text="processing ? '处理中...' : '开始处理'"
      ></button>

      <template x-if="processing">
        <button class="btn btn-cancel" @click="cancelProcessing">取消</button>
      </template>

      <!-- Progress -->
      <template x-if="processing || progress > 0">
        <div style="margin-top: 1rem">
          <div class="progress-bar-bg">
            <div
              class="progress-bar-fill"
              :style="'width:' + progress * 100 + '%'"
            ></div>
          </div>
          <p class="status processing" x-text="statusMessage"></p>
        </div>
      </template>

      <!-- Error -->
      <template x-if="error">
        <div>
          <p
            class="status error error-copyable"
            @click="copyError()"
            title="点击复制错误信息"
            x-text="'处理失败：' + error"
          ></p>
          <button class="btn btn-secondary error-copy-button" type="button" @click="copyError()">
            复制错误信息
          </button>
          <p class="error-copied" x-show="errorCopied">错误信息已复制。</p>
        </div>
      </template>

      <!-- Success -->
      <template x-if="downloadUrl">
        <div class="status success">
          <p>处理完成！</p>
          <a
            :href="downloadUrl"
            :download="outputFileName"
            style="
              display: inline-block;
              margin-top: 0.5rem;
              color: inherit;
              text-decoration: underline;
            "
          >
            <span>下载</span> <span x-text="outputFileName"></span>
          </a>
        </div>
      </template>
    </div>

    <script type="module">
      import registerApp from "./main.js";

      if (window.Alpine) {
        window.Alpine.data("videoCompressor", registerApp);
      } else {
        document.addEventListener("alpine:init", () => {
          window.Alpine.data("videoCompressor", registerApp);
        });
      }
    </script>
    <script
      defer
      src="./vendor/alpine.min.js"
    ></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[PWA] ServiceWorker registration successful:', registration.scope);
            })
            .catch((error) => {
              console.log('[PWA] ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
